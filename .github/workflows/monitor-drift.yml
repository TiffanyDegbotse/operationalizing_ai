name: Drift Monitoring

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - 'week4/data/**'
      - 'week4/scripts/**'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy scipy scikit-learn

      - name: Compute monitoring metrics
        id: metrics
        run: |
          cd week4/scripts
          python compute_metrics.py
        continue-on-error: true

      - name: Detect drift patterns
        id: drift
        run: |
          cd week4/scripts
          python detect_drift.py
        continue-on-error: true

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-metrics
          path: week4/metrics-*.json

      - name: Create alert if drift detected
        if: steps.drift.outcome == 'failure' || steps.metrics.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Drift detected in monitoring',
              body: 'Monitoring workflow detected data or concept drift. Check logs for details.',
              labels: ['drift-alert']
            })

      - name: Monitoring complete
        run: echo "Drift monitoring complete - check logs for findings"
