name: Drift Monitoring

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - 'week4/data/**'
      - 'week4/scripts/**'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy scipy scikit-learn

      - name: Compute monitoring metrics
        id: metrics
        run: |
          cd week4/scripts
          python compute_metrics.py
        continue-on-error: true

      - name: Detect drift patterns
        id: drift
        run: |
          cd week4/scripts
          python detect_drift.py
        continue-on-error: true

      - name: Alert if drift detected
        if: steps.drift.outcome == 'failure' || steps.metrics.outcome == 'failure'
        run: |
          echo "DRIFT ALERT - Drift or metric threshold breach detected"
          echo "In production this would notify ops via Slack, PagerDuty, or email"
          echo "Recommend reviewing logs and triggering retraining pipeline"

      - name: Monitoring complete
        run: echo "Drift monitoring complete - check logs for findings"
